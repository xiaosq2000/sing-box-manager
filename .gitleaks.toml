title = "Public source secret scanning"

[extend]
useDefault = true

# Each exception requires an exact public-file path and a reviewed non-secret
# value. Do not exempt entire test directories or production key formats.
# Target a rule: global path allowlists can skip a file before value checks.
[[allowlists]]
condition = "AND"
description = "Public Ed25519 verification key derived from test seed bytes 0..31"
paths = ['''(^|/)internal/trust/trust_test\.go$''']
regexTarget = "secret"
regexes = ['''^A6EHv/POEL4dcN0Y50vAmWfk1jCbpQ1fHdyGZBJVMbg=$''']
targetRules = ["generic-api-key"]

# These generated documentation fingerprints are public, not API keys.
# Retain exact older values for reachable history scans.
[[allowlists]]
condition = "AND"
description = "Reviewed public fingerprint for docs/SECRET_HANDLING.md"
paths = ['''^docstale\.lock$''']
regexTarget = "secret"
regexes = ['''^(fb3cd53af6289e44|6e1c9c75fa200d3b|3de8da97d6cf8142)$''']
targetRules = ["generic-api-key"]

[[allowlists]]
condition = "AND"
description = "Literal synthetic protocol credentials in fixture tests"
# config_loader covers reachable history. Current tests use inventory.
paths = [
  '''(^|/)tests/test_(config_loader|inventory|renderers|traffic_stats)\.py$''',
]
regexTarget = "secret"
regexes = [
  '''^(hy2-obfs-secret|bob-hysteria2-secret|carol-hysteria2-secret)(\\n)?$''',
]
targetRules = ["generic-api-key"]

[[allowlists]]
condition = "AND"
description = "Synthetic Django operator password in isolated PostgreSQL fixtures"
paths = ['''(^|/)tests/test_control_plane_integration\.py$''']
regexTarget = "secret"
regexes = ['''^synthetic-fixture-pass-123$''']
targetRules = ["generic-api-key"]

[[allowlists]]
condition = "AND"
description = "Synthetic API key used to test error-message redaction"
paths = ['''(^|/)tests/test_kiwivm\.py$''']
regexTarget = "secret"
regexes = ['''^private-api-key-0123456789$''']
targetRules = ["generic-api-key"]
