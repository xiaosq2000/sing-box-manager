# Maps each document to the source paths that may require a review.
# Keep the mappings aligned with the context table in AGENTS.md.
# Run `pixi run docstale check`, and stamp each document you review; agent
# hooks report documents that go stale during a session.

[sets]
cli = [
  "sing_box_manager/cli.py",
  "sing_box_manager/__main__.py",
  "pixi.toml",
  "pyproject.toml",
]
harness = [
  "docstale.toml",
  ".claude/agents/",
  ".claude/settings.json",
  ".codex/hooks.json",
  ".github/workflows/",
  ".pi/",
  "scripts/dev/",
  ".gitleaks.toml",
  ".prettierignore",
  ".gitignore",
  "config/.gitignore",
  "tests/test_public_repository.py",
  "tests/test_ci_workflows.py",
  "tests/test_shell_compat.py",
  "tests/test_powershell_compat.py",
  "tests/test_sing_box_114.py",
  "tests/test_tun_vm.py",
  "tests/test_tun_lifecycle.py",
]
sbc = [
  "go.mod",
  "go.sum",
  "cmd/sbc/",
  "internal/cli/",
  "internal/shell/",
  "internal/i18n/",
  "internal/install/",
  "internal/paths/",
  "internal/maintenance/",
  "internal/routes/",
  "internal/api/",
  "internal/probe/",
  "internal/singbox/",
  "internal/region/",
  "internal/tun/",
  "internal/service/",
  "internal/browserlanguage/",
  "internal/browserprivacy/",
  "internal/desktop/",
]
traffic = ["sing_box_manager/traffic_*.py", "sing_box_manager/connection_*.py"]
unix-installer = [
  "sing_box_manager/web/client/install.sh",
  "tests/test_install_sh.py",
  "tests/fixtures/legacy-unix/",
]

control-plane = [
  "sing_box_manager/control_plane/",
  "sing_box_manager/web/",
  "sing_box_manager/subscription.py",
  "sing_box_manager/cli.py",
  "sing_box_manager/settings.py",
  "sing_box_manager/deploy.py",
  "sing_box_manager/provision.py",
  "sing_box_manager/remote_config.py",
  "pixi.toml",
  "scripts/dev/test-control-plane-native.py",
  "tests/test_control_plane*.py",
  "tests/test_routes.py",
  "tests/test_mobile_import.py",
  "tests/test_auth.py",
  "tests/test_vps_info.py",
]

[documents]
"docs/README_MOBILE.md" = [
  "@control-plane",
  "sing_box_manager/desktop_config.py",
  "tests/test_mobile_config.py",
  "sing_box_manager/release/profiles.py",
  "sing_box_manager/release/renderers.py",
]
"docs/SNELL.md" = [
