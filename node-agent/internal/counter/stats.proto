syntax = "proto3";

package v2ray.core.app.stats.command;
option go_package = "github.com/xiaosq2000/sing-box-manager/node-agent/internal/counter";

// Wire fields used by sing-box v1.14.3 experimental/v2rayapi.
message Stat {
  string name = 1;
  int64 value = 2;
}
message QueryStatsRequest {
  string pattern = 1;
  bool reset = 2;
  repeated string patterns = 3;
  bool regexp = 4;
}
message QueryStatsResponse {
  repeated Stat stat = 1;
}
