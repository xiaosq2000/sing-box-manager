name: sbc

# ci.yml runs the Go checks on Linux through pixi. This workflow adds macOS,
# and the end-to-end test on Linux, macOS and Windows. These jobs run only when
# sbc, its installer or the
# sing-box it installs changes. It does not use pixi, whose lockfile targets
# linux-64 only; setup-go installs the Go version go.mod names.
on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "sing_box_manager/web/client/install.sh"
      - "sing_box_manager/web/client/install.ps1"
      - "scripts/dev/test-install-ps1.ps1"
      - "config/inventory/example.yaml"
      - ".github/workflows/sbc.yml"
      - "scripts/dev/test-tun-vm.sh"
      - "scripts/dev/fetch-tun-image.sh"
      - "scripts/dev/tun-vm/**"
      - "sing_box_manager/desktop_config.py"
      - "sing_box_manager/release/**"
      - "sing_box_manager/settings.py"
  pull_request:
    branches: [main, feat/m1b-tun-core, feat/m1b-tun-maintenance]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "sing_box_manager/web/client/install.sh"
      - "sing_box_manager/web/client/install.ps1"
      - "scripts/dev/test-install-ps1.ps1"
      - "config/inventory/example.yaml"
      - ".github/workflows/sbc.yml"
      - "scripts/dev/test-tun-vm.sh"
      - "scripts/dev/fetch-tun-image.sh"
      - "scripts/dev/tun-vm/**"
      - "sing_box_manager/desktop_config.py"
      - "sing_box_manager/release/**"
      - "sing_box_manager/settings.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; a push to main is not, because
  # cancelling it would leave that commit permanently unvalidated.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      # The unit tests stand sing-box in with shell scripts, so Windows gets
      # the compile check here and the end-to-end test below.
      - run: GOOS=windows go vet ./...

  e2e:
    # Installs sbc through the hosted installers and drives the real service
    # manager on disposable runners.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      SBC_E2E: "1"
      # The test fetches the pinned sing-box from GitHub's API.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start a systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime_dir="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          for _ in $(seq 30); do
            if XDG_RUNTIME_DIR=$runtime_dir systemctl --user show-environment >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "the systemd user manager did not start" >&2
          exit 1
      - name: Test Windows settings with a disposable registry key
        if: runner.os == 'Windows'
        run: go test -count=1 ./internal/winsettings ./internal/desktop ./internal/powershell ./internal/maintenance ./internal/paths
      - name: Test Windows wrapper cleanup with a disposable child process
        if: runner.os == 'Windows'
        run: go test -count=1 ./internal/cli -run '^TestWindowsEngineJob'
      - name: Test CLI help, validation and native PowerShell completion
        if: runner.os == 'Windows'
        run: go test -count=1 ./internal/cli -run 'Test(CommandHelp|CLIValidation|Completion)'
      - name: Test bootstrapper fixtures on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/dev/test-install-ps1.ps1
      - name: Test bootstrapper fixtures on PowerShell 7
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/dev/test-install-ps1.ps1
      - run: go test -tags e2e -count=1 -v ./internal/e2e

  e2e-tun:
    # Each suite has its own disposable runner and guest.
    strategy:
      fail-fast: false
      matrix:
        suite: [core, lifecycle]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          locked: true
          cache: true
      - name: Restore TUN build cache
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-tun-build-v1-${{ hashFiles('pixi.lock') }}-${{ hashFiles('go.sum', 'cmd/**/*.go', 'internal/**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-tun-build-v1-${{ hashFiles('pixi.lock') }}-
      - name: Install the VM tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils netcat-openbsd
      - name: Select the VM accelerator
        run: |
          # This changes device access only on the disposable hosted runner.
          if [ -c /dev/kvm ]; then
            sudo chown "$(id -u)" /dev/kvm || echo "Could not grant KVM access; testing existing access." >&2
          fi
          accel=$(pixi run python scripts/dev/tun-vm/select-accel.py)
          echo "SBC_TUN_E2E_ACCEL=$accel" >> "$GITHUB_ENV"
          echo "TUN suite ${{ matrix.suite }}: accelerator=$accel" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare the verified binaries and cloud image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pixi run fetch-sing-box
          bash scripts/dev/fetch-tun-image.sh
      - name: Run complete Linux TUN acceptance (${{ matrix.suite }})
        run: pixi run bash scripts/dev/test-tun-vm.sh "${{ matrix.suite }}"
      - name: Save TUN build cache
        if: github.event_name == 'push' && github.ref_name == 'main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
