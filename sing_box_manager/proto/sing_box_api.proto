// Trimmed subset of the sing-box API service definition.
//
// Source: https://github.com/SagerNet/sing-box/blob/v1.14.0/daemon/started_service.proto
// Pinned to sing-box 1.14.0. Revisit on every `sing_box_version` bump.
//
// Only the connection-tracking surface is reproduced here. `package daemon` and
// `service StartedService` must be preserved verbatim so the wire method path
// stays "/daemon.StartedService/SubscribeConnections"; field numbers must match
// upstream exactly. Fields upstream sends that are absent here decode as unknown
// fields and are ignored, so a trimmed message reads a full one correctly.

syntax = "proto3";

package daemon;

service StartedService {
  rpc SubscribeConnections(SubscribeConnectionsRequest) returns (stream ConnectionEvents) {}
}

message SubscribeConnectionsRequest {
  // Nanoseconds: the server does time.Duration(interval). A value <= 0 means
  // one second; a small positive value is a busy loop, not a slow tick.
  int64 interval = 1;
}

enum ConnectionEventType {
  CONNECTION_EVENT_NEW = 0;
  CONNECTION_EVENT_UPDATE = 1;
  CONNECTION_EVENT_CLOSED = 2;
}

message ConnectionEvent {
  ConnectionEventType type = 1;
  string id = 2;
  Connection connection = 3;
  int64 uplinkDelta = 4;
  int64 downlinkDelta = 5;
  int64 closedAt = 6;
}

message ConnectionEvents {
  repeated ConnectionEvent events = 1;
  // Set on the first frame of a subscription. The frame replays every live
  // connection *and* up to 1000 already-closed ones as NEW events; consumers
  // must deduplicate by connection id or they will re-bill the replay.
  bool reset = 2;
}

message Connection {
  string id = 1;
  string inbound = 2;
  string inboundType = 3;
  int32 ipVersion = 4;
  string network = 5;
  string source = 6;
  string destination = 7;
  string domain = 8;
  string protocol = 9;
  string user = 10;
  string fromOutbound = 11;
  int64 createdAt = 12;
  int64 closedAt = 13;
  int64 uplink = 14;
  int64 downlink = 15;
  int64 uplinkTotal = 16;
  int64 downlinkTotal = 17;
  string rule = 18;
  string outbound = 19;
  string outboundType = 20;
  repeated string chainList = 21;
  ProcessInfo processInfo = 22;
}

message ProcessInfo {
  uint32 processId = 1;
  int32 userId = 2;
  string userName = 3;
  string processPath = 4;
  repeated string packageNames = 5;
}
